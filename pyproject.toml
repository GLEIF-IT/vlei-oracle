[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vlei-oracle"
version = "0.1.0"
description = "Authenticated EOA status receiver and Ethereum association endorsement publisher"
readme = "README.md"
requires-python = ">=3.12.6"
license = { text = "Apache-2.0" }
authors = [
  { name = "GLEIF IT" }
]
dependencies = [
  "eth-account==0.14.0",
  "gleif_keri==1.2.19",
  "gleif_hio==0.6.22",
  "web3==8.0.0"
]

[project.urls]
Repository = "https://github.com/GLEIF-IT/vlei-oracle"
Documentation = "https://github.com/GLEIF-IT/vlei-oracle/blob/main/docs/status-inbox.md"

[project.optional-dependencies]
dev = [
  "pytest>=9"
]

[project.scripts]
vlei-oracle = "vlei_oracle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vlei_oracle.verification" = ["schema_data/acdc/*.json"]
"vlei_oracle.endorsement" = ["contract_data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["scripts/protocol"]
