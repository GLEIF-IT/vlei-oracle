# Public ingress for the loopback-only oracle backend. Run as a service account.
worker_processes 1;
pid nginx.pid;
error_log stderr;
events { worker_connections 128; }
http {
    access_log off;
    client_max_body_size 64k;
    client_body_buffer_size 8k;
    client_body_temp_path client_body;
    server {
        listen 9722;
        server_name _;
        location / {
            # Read and check the entire body before contacting HIO, including chunks.
            proxy_request_buffering on;
            proxy_http_version 1.1;
            proxy_pass http://127.0.0.1:9723;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_next_upstream off;
        }
    }
}
