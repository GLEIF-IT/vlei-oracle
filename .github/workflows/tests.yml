name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  installed-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Select qualified dependency revisions
        id: dependencies
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          pins = json.loads(Path("scripts/integration/dependencies.json").read_text())
          for name in ("verifier", "comply"):
              print(f"{name}={pins[name]['commit']}")
          PY
      - name: Check out Verifier fixture tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: GLEIF-IT/eoa-verifier
          ref: ${{ steps.dependencies.outputs.verifier }}
          path: verifier
          persist-credentials: false
      - name: Check out qualified contracts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: GLEIF-IT/vlei-comply
          ref: ${{ steps.dependencies.outputs.comply }}
          path: comply
          ssh-key: ${{ secrets.VLEI_COMPLY_READ_KEY }}
          persist-credentials: false
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.5.1
          cache: false
      - name: Build and install Oracle wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m venv "$RUNNER_TEMP/oracle-tests"
          "$RUNNER_TEMP/oracle-tests/bin/python" -m pip install dist/*.whl -r tests/requirements.txt
      - name: Test installed package outside checkout
        env:
          VLEI_COMPLY_DIR: ${{ github.workspace }}/comply
          VERIFIER_TOOL_SOURCE: ${{ github.workspace }}/verifier
        run: |
          export ORACLE_WHEEL="$(find "$GITHUB_WORKSPACE/dist" -name 'vlei_oracle-*.whl' -print -quit)"
          mkdir "$RUNNER_TEMP/qualification"
          cp -R tests scripts protocol "$RUNNER_TEMP/qualification/"
          cp pytest.ini README.md "$RUNNER_TEMP/qualification/"
          cd "$RUNNER_TEMP/qualification"
          "$RUNNER_TEMP/oracle-tests/bin/vlei-oracle" server receive --help
          "$RUNNER_TEMP/oracle-tests/bin/vlei-oracle" server start --help
          "$RUNNER_TEMP/oracle-tests/bin/python" -m pytest -q tests
