name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  installed-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build and install wheel with pinned sender
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m venv "$RUNNER_TEMP/oracle-tests"
          "$RUNNER_TEMP/oracle-tests/bin/python" -m pip install dist/*.whl -r tests/requirements.txt -r scripts/protocol/requirements.txt
      - name: Test installed packages outside checkout
        run: |
          mkdir "$RUNNER_TEMP/qualification"
          cp -R tests scripts protocol "$RUNNER_TEMP/qualification/"
          cd "$RUNNER_TEMP/qualification"
          "$RUNNER_TEMP/oracle-tests/bin/vlei-oracle" server receive --help
          "$RUNNER_TEMP/oracle-tests/bin/vlei-oracle" server start --help
          PYTHONPATH=scripts/protocol "$RUNNER_TEMP/oracle-tests/bin/python" -m pytest -q tests --ignore=tests/test_contract_effects.py
          # Contract effects require the separately qualified vlei-comply checkout;
          # this receive-only increment does not exercise Ethereum posting in CI.
