name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  installed-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check out qualified contracts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: GLEIF-IT/vlei-comply
          ref: 6220cd78411b8b721838ee67f11293ff5504c05c
          path: comply
          ssh-key: ${{ secrets.VLEI_COMPLY_READ_KEY }}
          persist-credentials: false
          submodules: recursive
      - name: Install Foundry and build contracts
        run: |
          curl -LfsS https://github.com/foundry-rs/foundry/releases/download/v1.5.1/foundry_v1.5.1_linux_amd64.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          cd comply
          "$RUNNER_TEMP/forge" build
      - name: Build and install wheel with pinned sender
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m venv "$RUNNER_TEMP/oracle-tests"
          "$RUNNER_TEMP/oracle-tests/bin/python" -m pip install dist/*.whl -r tests/requirements.txt -r scripts/protocol/requirements.txt
      - name: Test installed packages outside checkout
        env:
          VLEI_COMPLY_DIR: ${{ github.workspace }}/comply
        run: |
          mkdir "$RUNNER_TEMP/qualification"
          cp -R tests scripts protocol "$RUNNER_TEMP/qualification/"
          cd "$RUNNER_TEMP/qualification"
          "$RUNNER_TEMP/oracle-tests/bin/vlei-oracle" server receive --help
          "$RUNNER_TEMP/oracle-tests/bin/vlei-oracle" server start --help
          PYTHONPATH=scripts/protocol "$RUNNER_TEMP/oracle-tests/bin/python" -m pytest -q tests
